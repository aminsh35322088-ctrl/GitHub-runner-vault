name: Deploy to Cloudflare

# Optional unattended deployment route. Wrangler OAuth is the no-GitHub-Secret
# path; this workflow remains available for owners who explicitly configure a
# Cloudflare API token and trigger the deployment manually.

on:
  # Automatic push deployments require a long-lived Cloudflare API token in
  # GitHub Actions. Keep this workflow explicitly manual; maintainers can use
  # Wrangler OAuth from an authorized environment without adding a repo secret.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Cloudflare account
        id: cf-account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing required GitHub Actions secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token in the setup wizard and save it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal ID of the target Cloudflare account."
              exit 1
            fi
            echo "account_id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          ACCOUNT_ID="$(printf '%s' "$response" | python3 -c '
          import json, re, sys
          try:
              payload = json.load(sys.stdin)
              accounts = payload.get("result") or []
              candidates = [item.get("id", "") for item in accounts if isinstance(item, dict)]
              account_id = candidates[0] if payload.get("success") is True and len(candidates) == 1 else ""
              if not re.fullmatch(r"[a-fA-F0-9]{32}", account_id):
                  account_id = ""
          except Exception:
              account_id = ""
          print(account_id)
          ')"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve exactly one valid Cloudflare account from CLOUDFLARE_API_TOKEN. If the token can access multiple accounts, add CLOUDFLARE_ACCOUNT_ID with the intended 32-character account ID."
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy the vault Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
          RUNNER_VAULT_OWNER_GITHUB_ID: ${{ github.event.repository.owner.id }}
        run: pnpm deploy

      - name: Publish deployment info
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node app/scripts/deployment-info.mjs

      - name: Commit deployment info
        shell: bash
        run: |
          set -euo pipefail
          # Preserve metadata for the exact deployed commit, then publish it
          # onto the latest branch tip. Ordinary pushes may advance main while
          # the Worker deploys; retry on a non-fast-forward race.
          metadata_file="$RUNNER_TEMP/deployment.json"
          cp deployment.json "$metadata_file"
          deployment_branch="$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin "$deployment_branch:refs/remotes/origin/$deployment_branch"
            git checkout -B deployment-metadata "origin/$deployment_branch"
            cp "$metadata_file" deployment.json
            git add deployment.json
            if git diff --cached --quiet -- deployment.json; then
              echo "deployment.json is already current; nothing to publish."
              exit 0
            fi
            git commit -m 'chore(deploy): publish deployment info [skip ci]'
            if git push origin "HEAD:refs/heads/$deployment_branch"; then
              exit 0
            fi
            echo "::warning::The branch advanced during deployment-info publication (attempt $attempt/5); retrying against the latest tip."
          done

          echo "::error::Could not publish deployment.json after five attempts."
          exit 1

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          VAULT_URL="$(python3 -c 'import json; print(json.load(open("deployment.json"))["url"])')"
          {
            echo "## Vault deployed"
            echo
            echo "- Vault: ${VAULT_URL}"
            echo "- Finish setup: ${VAULT_URL}/setup — open it and choose **Create the GitHub App**."
            echo "- The Runner Lab reads \`deployment.json\` from this repository and connects automatically; no Lab-side variables are needed."
          } >> "$GITHUB_STEP_SUMMARY"
