name: Validate Vault

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify production build owner derivation from Git origin
        shell: bash
        run: |
          set -euo pipefail
          cd app
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          pnpm build 2>&1 | tee "$build_log"
          owner_id="$(sed -nE \\
            -e 's/.*\\[deploy-owner\\] bound GitHub account ID ([1-9][0-9]*) from .*/\\1/p' \\
            -e 's/.*\\[deploy-owner\\] using GitHub Actions repository owner ID ([1-9][0-9]*).*/\\1/p' \\
            "$build_log" | tail -n1)"
          test -n "$owner_id"
          OWNER_ID="$owner_id" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const expected = process.env.OWNER_ID
          const config = JSON.parse(readFileSync('dist/rsc/wrangler.json', 'utf8'))
          if (!expected || config.vars?.OWNER_GITHUB_ID !== expected) {
            throw new Error('Generated Worker config does not contain the exact GitHub origin owner ID')
          }
          console.log('[deploy-owner] verified generated Worker runtime binding: ' + expected)
          NODE

      - name: Validate the standalone Deploy Button project
        shell: bash
        run: |
          project="$(mktemp -d)"
          trap 'rm -rf "$project"' EXIT
          git archive HEAD app | tar -x -C "$project"
          cd "$project/app"
          pnpm install --frozen-lockfile
          pnpm validate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical validation
        run: pnpm validate
