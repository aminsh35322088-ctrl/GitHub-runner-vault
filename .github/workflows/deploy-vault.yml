name: Deploy Runner Vault

on:
  repository_dispatch:
    types: [deploy_to_cf_workers]

permissions:
  contents: read

concurrency:
  group: runner-vault-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and bind GitHub owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the repository created by Deploy to Cloudflare
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Resolve the immutable GitHub repository owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          owner_type="$(jq -r '.repository.owner.type // empty' "$GITHUB_EVENT_PATH")"
          owner_id="$(jq -r '.repository.owner.id // empty' "$GITHUB_EVENT_PATH")"
          repository="$(jq -r '.repository.full_name // empty' "$GITHUB_EVENT_PATH")"

          if [[ "$repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::repository_dispatch repository does not match the running repository"
            exit 1
          fi
          if [[ "$owner_type" != "User" || ! "$owner_id" =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo "::error::Only a personal GitHub account with a valid numeric owner ID can own this vault"
            exit 1
          fi

          echo "id=$owner_id" >> "$GITHUB_OUTPUT"
          echo "Verified GitHub repository owner ID: $owner_id"

      - name: Ensure the D1 database is provisioned and bound
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/package.json ]]; then
            cd app
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const configPath = 'wrangler.jsonc'
          let config = readFileSync(configPath, 'utf8')
          const binding = config.match(/\{[^{}]*"binding"\s*:\s*"DB"[^{}]*\}/s)?.[0]
          if (!binding) throw new Error('DB D1 binding is missing from wrangler.jsonc')
          if (/\bdatabase_id\s*:/.test(binding)) {
            console.log('D1 database ID is already configured')
            process.exit(0)
          }

          const databaseName = binding.match(/"database_name"\s*:\s*"([^"]+)"/)?.[1]
          if (!databaseName) throw new Error('DB database_name is missing from wrangler.jsonc')
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const apiToken = process.env.CLOUDFLARE_API_TOKEN
          if (!accountId || !apiToken) throw new Error('Cloudflare deployment credentials are missing')

          async function cf(path, method = 'GET', body) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${apiToken}`,
                'Content-Type': 'application/json',
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            })
            const payload = await response.json()
            if (!response.ok || !payload.success) {
              throw new Error(`Cloudflare API ${method} ${path} failed: ${JSON.stringify(payload.errors ?? [])}`)
            }
            return payload.result
          }

          const listPath = `/accounts/${accountId}/d1/database?name=${encodeURIComponent(databaseName)}`
          let databases = await cf(listPath)
          let database = databases.find((item) => item.name === databaseName)
          if (!database) {
            database = await cf(`/accounts/${accountId}/d1/database`, 'POST', { name: databaseName })
          }
          const databaseId = database.uuid ?? database.id
          if (typeof databaseId !== 'string' || !/^[a-f0-9-]{16,64}$/i.test(databaseId)) {
            throw new Error('Cloudflare did not return a valid D1 database ID')
          }

          const bindingPattern = /(\{[^{}]*"binding"\s*:\s*"DB"[^{}]*\})/s
          config = config.replace(bindingPattern, (block) =>
            block.replace(/("database_name"\s*:\s*"[^"]+")\s*,?/, (_match, name) => `${name},\n      "database_id": "${databaseId}"`)
          )
          writeFileSync(configPath, config)
          console.log(`D1 database bound: ${databaseName}`)
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the locked Worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/package.json ]]; then
            cd app
          fi
          pnpm install --frozen-lockfile
          pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind the verified owner as a Worker secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/package.json ]]; then
            cd app
          fi
          printf '%s' "$OWNER_GITHUB_ID" | pnpm exec wrangler secret put OWNER_GITHUB_ID --config wrangler.jsonc
        env:
          OWNER_GITHUB_ID: ${{ steps.owner.outputs.id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
