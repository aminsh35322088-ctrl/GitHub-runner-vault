name: Deploy to Cloudflare

# The one supported deployment route. The setup wizard (docs/index.html,
# published via GitHub Pages) walks the owner through creating the single
# required secret, CLOUDFLARE_API_TOKEN; this workflow does everything else:
# build, D1 provisioning, VAULT_MASTER_KEY provisioning (scripts/deploy.mjs)
# and publishing deployment.json for the Runner Lab to discover.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

concurrency:
  group: vault-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Cloudflare account
        id: cf-account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "account_id=${CLOUDFLARE_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          ACCOUNT_ID="$(printf '%s' "$response" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
              accounts = payload.get("result") or []
          except Exception:
              accounts = []
          print(accounts[0]["id"] if len(accounts) == 1 else "")
          ')"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve exactly one Cloudflare account from CLOUDFLARE_API_TOKEN (the token must see exactly one account). If your token can access several accounts, add a CLOUDFLARE_ACCOUNT_ID repository secret naming the account to deploy to."
            exit 1
          fi
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy the vault Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
          RUNNER_VAULT_OWNER_GITHUB_ID: ${{ github.event.repository.owner.id }}
        run: pnpm deploy

      - name: Publish deployment info
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf-account.outputs.account_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node app/scripts/deployment-info.mjs

      - name: Commit deployment info
        shell: bash
        run: |
          set -euo pipefail
          git add deployment.json
          if git diff --cached --quiet -- deployment.json; then
            echo "deployment.json is unchanged; nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deploy): publish deployment info [skip ci]'
          git push

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          VAULT_URL="$(python3 -c 'import json; print(json.load(open("deployment.json"))["url"])')"
          {
            echo "## Vault deployed"
            echo
            echo "- Vault: ${VAULT_URL}"
            echo "- Finish setup: ${VAULT_URL}/setup — open it and choose **Create the GitHub App**."
            echo "- The Runner Lab reads \`deployment.json\` from this repository and connects automatically; no Lab-side variables are needed."
          } >> "$GITHUB_STEP_SUMMARY"
